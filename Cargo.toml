[package]
name = "metaclean"
version = "0.1.0"
edition = "2021"
authors = ["r3dg0d <r3dg0d@users.noreply.github.com>"]
description = "Metadata inspector and scrubber for images, audio, video, PDF, and Office documents"
license = "MIT"
repository = "https://github.com/r3dg0d/metaclean"
homepage = "https://github.com/r3dg0d/metaclean"
documentation = "https://docs.rs/metaclean"
readme = "README.md"
keywords = ["metadata", "exif", "privacy", "scrub", "cli"]
categories = ["command-line-utilities", "multimedia"]
rust-version = "1.75"

[[bin]]
name = "metaclean"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
directories = "5"
hex = "0.4"
id3 = "1.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
infer = "0.16"
kamadak-exif = "0.5"
lopdf = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
